<div class="space-y-6">
  <div class="flex items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold text-surface-950 dark:text-surface-50">Users</h1>
      <p class="text-sm text-surface-500 dark:text-surface-400">
        Internal manager accounts · superadmin only
      </p>
    </div>
    <button class="btn-primary" type="button" (click)="registerDrawer.open()">
      <i class="pi pi-plus"></i>
      Register
    </button>
  </div>

  <div class="card overflow-hidden">
    <p-table [value]="users()" dataKey="email">
      <ng-template #header>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Last login</th>
        </tr>
      </ng-template>
      <ng-template #body let-user>
        <tr>
          <td class="text-sm font-medium">{{ user.name }}</td>
          <td class="text-sm">{{ user.email }}</td>
          <td>
            <p-tag [value]="user.role | titlecase" [severity]="roleSeverity(user.role)" />
          </td>
          <td class="text-sm">
            @if (user.last_login) {
              {{ user.last_login | date: 'MMM d, y HH:mm' }}
            } @else {
              —
            }
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<app-register-user-drawer #registerDrawer (registered)="onRegistered($event)" />
