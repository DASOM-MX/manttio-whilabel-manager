<p-drawer
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  position="right"
  styleClass="!w-full !max-w-1/2 sm:!w-96"
  header="Register billing record"
>
  <form class="flex h-full flex-col gap-5" [formGroup]="form" (ngSubmit)="submit()">
    <div class="field-group">
      <label class="field-label" for="register-record-concept">Concept</label>
      <input
        class="field-input"
        id="register-record-concept"
        type="text"
        formControlName="concept"
        placeholder="Monthly subscription — July 2026"
      />
    </div>
    <div class="field-group">
      <label class="field-label" for="register-record-amount">Amount (MXN)</label>
      <input
        class="field-input"
        id="register-record-amount"
        type="number"
        min="1"
        formControlName="amount"
        placeholder="375"
      />
    </div>
    <div class="field-group">
      <label class="field-label" for="register-record-payment-type">Payment type</label>
      <p-select
        class="field-input"
        inputId="register-record-payment-type"
        [options]="paymentTypeOptions"
        optionLabel="label"
        optionValue="value"
        formControlName="payment_type"
        appendTo="body"
      />
    </div>
    <div class="field-group">
      <label class="field-label" for="register-record-status">Status</label>
      <p-select
        class="field-input"
        inputId="register-record-status"
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        formControlName="status"
        appendTo="body"
      />
    </div>
    <div class="field-group">
      <label class="field-label" for="register-record-cfdi-folio">CFDI folio (optional)</label>
      <input
        class="field-input"
        id="register-record-cfdi-folio"
        type="text"
        formControlName="cfdi_folio"
      />
    </div>

    <div class="mt-auto flex justify-end gap-3">
      <button class="btn-neutral" type="button" (click)="visible.set(false)">Cancel</button>
      <button class="btn-primary" type="submit" [disabled]="form.invalid">Register</button>
    </div>
  </form>
</p-drawer>
